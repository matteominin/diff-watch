[project]
name = "diffwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matteo Minin", email = "matteominin@yahoo.it" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.92",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "selectolax>=0.4.11",
]

[project.scripts]
diffwatch = "diffwatch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.19.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "testcontainers[postgres]>=4.15.0",
]
